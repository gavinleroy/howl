name: demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pages deployment needs these; the build job itself only reads.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The derivation runs the Guile suite and the wasm end-to-end tests
      # in its checkPhase, so a broken build never reaches Pages.
      - name: Build the demo page
        run: nix build .#demo --print-build-logs

      - name: Collect the output
        run: |
          mkdir -p public
          cp -rL result/. public/
          touch public/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    # Pull requests are built as a check, but only main is published.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
